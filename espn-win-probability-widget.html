<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Win Probability Chart</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --surface: #161922;
    --border: #252932;
    --text: #e8eaf0;
    --muted: #6b7280;
    --accent: #3b82f6;
  }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .widget {
    width: 100%;
    max-width: 780px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    position: relative;
  }

  .header {
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .header-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    min-width: 90px;
  }

  .game-info {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    justify-content: center;
  }

  .team-block { display: flex; align-items: center; gap: 8px; }

  .team-logo {
    width: 32px; height: 32px;
    border-radius: 50%;
    object-fit: contain;
    background: #1e2230;
  }

  .team-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .score-block {
    display: flex; flex-direction: column;
    align-items: center; gap: 2px;
    padding: 0 14px;
  }

  .score {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px; font-weight: 800;
    letter-spacing: 0.05em; line-height: 1;
  }

  .game-status { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }

  .prob-bar-container { padding: 14px 20px 10px; }

  .prob-labels { display: flex; justify-content: space-between; margin-bottom: 6px; }

  .prob-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px; font-weight: 700; letter-spacing: 0.03em;
  }

  .prob-bar {
    height: 8px; border-radius: 4px;
    overflow: hidden; display: flex;
    background: var(--border);
  }

  .prob-fill-away { height: 100%; transition: width 0.6s ease; }
  .prob-fill-home { height: 100%; flex: 1; }

  .chart-area { padding: 0 16px 8px; }
  .chart-wrap { position: relative; height: 200px; }

  .quarter-labels {
    display: flex; justify-content: space-between;
    padding: 4px 8px 14px;
  }

  .q-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); text-align: center; flex: 1;
  }

  .plays-section { border-top: 1px solid var(--border); padding: 14px 20px; }

  .plays-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 10px;
  }

  .plays-list {
    display: flex; flex-direction: column; gap: 6px;
    max-height: 150px; overflow-y: auto;
  }

  .plays-list::-webkit-scrollbar { width: 3px; }
  .plays-list::-webkit-scrollbar-track { background: transparent; }
  .plays-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .play-item {
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 12px; color: var(--muted);
    padding: 6px 8px; border-radius: 6px;
    background: rgba(255,255,255,0.02);
    border-left: 3px solid transparent;
  }

  .play-swing {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px; font-weight: 700;
    min-width: 44px; text-align: right;
  }

  .play-desc { flex: 1; line-height: 1.4; }

  .footer {
    border-top: 1px solid var(--border);
    padding: 10px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }

  .footer-source { font-size: 10px; color: var(--muted); letter-spacing: 0.04em; }
  .game-id-input-wrap { display: flex; gap: 6px; align-items: center; }

  .game-id-input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 12px; padding: 5px 10px;
    border-radius: 6px; width: 130px;
    outline: none; transition: border-color 0.2s;
  }

  .game-id-input:focus { border-color: var(--accent); }
  .game-id-input::placeholder { color: var(--muted); }

  .load-btn {
    background: var(--accent); color: #fff; border: none;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    padding: 6px 12px; border-radius: 6px;
    cursor: pointer; transition: opacity 0.2s;
  }

  .load-btn:hover { opacity: 0.85; }

  .state-overlay {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 240px; gap: 10px;
    color: var(--muted); font-size: 13px;
  }

  .spinner {
    width: 28px; height: 28px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg {
    color: #f87171; font-size: 12px;
    text-align: center; max-width: 300px; line-height: 1.6;
  }

  .tooltip-box {
    position: absolute;
    background: #1e2230;
    border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 10px;
    font-size: 11px; pointer-events: none;
    opacity: 0; transition: opacity 0.15s;
    z-index: 10; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }

  .tooltip-box.visible { opacity: 1; }
  .tooltip-team { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; }
  .tooltip-sub { color: var(--muted); margin-top: 2px; max-width: 220px; white-space: normal; }
</style>
</head>
<body>

<div class="widget" id="widget">
  <div class="header">
    <span class="header-label">Win Probability</span>
    <div class="game-info" id="gameInfo"></div>
    <span class="header-label" style="text-align:right;"></span>
  </div>

  <div id="content">
    <div class="state-overlay"><div class="spinner"></div><span>Loading game data…</span></div>
  </div>

  <div class="footer">
    <span class="footer-source">Data: ESPN</span>
    <div class="game-id-input-wrap">
      <input class="game-id-input" id="gameIdInput" placeholder="ESPN Game ID" value="401772900" />
      <button class="load-btn" onclick="loadGame()">Load</button>
    </div>
  </div>
</div>

<div class="tooltip-box" id="tooltip">
  <div class="tooltip-team" id="ttTeam"></div>
  <div class="tooltip-sub" id="ttSub"></div>
</div>

<script>
const WORKER_URL = "https://white-water-f2e8.max-m-purdon.workers.dev";
let chartInstance = null;

async function loadGame() {
  const gameId = document.getElementById("gameIdInput").value.trim();
  if (!gameId) return;
  showLoading();
  try {
    const res = await fetch(WORKER_URL + "/?gameId=" + gameId);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    render(data);
  } catch (e) {
    showError("Could not load game data.<br><small>" + e.message + "</small>");
    console.error(e);
  }
}

function render(data) {
  const comp = data.header && data.header.competitions && data.header.competitions[0];
  if (!comp) { showError("Unexpected data format from ESPN."); return; }

  const away = comp.competitors.find(function(t) { return t.homeAway === "away"; });
  const home = comp.competitors.find(function(t) { return t.homeAway === "home"; });
  const winProb = data.winprobability || [];
  const plays = data.plays || [];

  const awayColor = "#" + ((away && away.team && away.team.color) || "e74c3c");
  const homeColor = "#" + ((home && home.team && home.team.color) || "3498db");

  const last = winProb[winProb.length - 1];
  const homeWP = last ? Math.round(last.homeWinPercentage * 100) : 50;
  const awayWP = 100 - homeWP;

  const awayAbbr = (away && away.team && away.team.abbreviation) || "AWAY";
  const homeAbbr = (home && home.team && home.team.abbreviation) || "HOME";
  const awayScore = (away && away.score != null) ? away.score : "–";
  const homeScore = (home && home.score != null) ? home.score : "–";
  const statusText = (comp.status && comp.status.type && comp.status.type.shortDetail) || "Final";

  document.getElementById("gameInfo").innerHTML =
    '<div class="team-block">' +
      '<img class="team-logo" src="https://a.espncdn.com/i/teamlogos/nfl/500/' + awayAbbr.toLowerCase() + '.png" onerror="this.style.display=\'none\'" alt="">' +
      '<span class="team-name" style="color:' + awayColor + '">' + awayAbbr + '</span>' +
    '</div>' +
    '<div class="score-block">' +
      '<div class="score">' + awayScore + ' \u2013 ' + homeScore + '</div>' +
      '<div class="game-status">' + statusText + '</div>' +
    '</div>' +
    '<div class="team-block">' +
      '<span class="team-name" style="color:' + homeColor + '">' + homeAbbr + '</span>' +
      '<img class="team-logo" src="https://a.espncdn.com/i/teamlogos/nfl/500/' + homeAbbr.toLowerCase() + '.png" onerror="this.style.display=\'none\'" alt="">' +
    '</div>';

  document.getElementById("content").innerHTML =
    '<div class="prob-bar-container">' +
      '<div class="prob-labels">' +
        '<span class="prob-label" style="color:' + awayColor + '">' + awayAbbr + ' ' + awayWP + '%</span>' +
        '<span class="prob-label" style="color:' + homeColor + '">' + homeWP + '% ' + homeAbbr + '</span>' +
      '</div>' +
      '<div class="prob-bar">' +
        '<div class="prob-fill-away" style="width:' + awayWP + '%;background:' + awayColor + '"></div>' +
        '<div class="prob-fill-home" style="background:' + homeColor + '"></div>' +
      '</div>' +
    '</div>' +
    '<div class="chart-area"><div class="chart-wrap"><canvas id="wpChart"></canvas></div></div>' +
    '<div class="quarter-labels" id="quarterLabels"></div>' +
    '<div class="plays-section">' +
      '<div class="plays-title">Key Swings</div>' +
      '<div class="plays-list" id="playsList"></div>' +
    '</div>';

  if (winProb.length === 0) {
    document.querySelector(".chart-area").innerHTML =
      '<div class="state-overlay" style="min-height:160px;"><span>No win probability data available for this game.</span></div>';
  } else {
    buildChart(winProb, away, home, awayColor, homeColor, plays);
  }

  buildKeyPlays(plays, away, home, awayColor, homeColor);
  buildQuarterLabels(winProb);
}

function buildChart(winProb, away, home, awayColor, homeColor, plays) {
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

  var labels = winProb.map(function(_, i) { return i; });
  var homeData = winProb.map(function(p) { return +(p.homeWinPercentage * 100).toFixed(1); });

  var playMap = {};
  plays.forEach(function(p) { playMap[p.id] = p.text || ""; });
  var playTexts = winProb.map(function(p) { return playMap[p.playId] || ""; });

  var ctx = document.getElementById("wpChart").getContext("2d");

  var gradHome = ctx.createLinearGradient(0, 0, 0, 200);
  gradHome.addColorStop(0, homeColor + "55");
  gradHome.addColorStop(1, homeColor + "00");

  var gradAway = ctx.createLinearGradient(0, 0, 0, 200);
  gradAway.addColorStop(0, awayColor + "00");
  gradAway.addColorStop(1, awayColor + "44");

  var homeAbbr = (home && home.team && home.team.abbreviation) || "HOME";
  var awayAbbr = (away && away.team && away.team.abbreviation) || "AWAY";

  chartInstance = new Chart(ctx, {
    type: "line",
    data: {
      labels: labels,
      datasets: [{
        data: homeData,
        borderColor: homeColor,
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 5,
        pointHoverBackgroundColor: homeColor,
        fill: { target: { value: 50 }, above: gradHome, below: gradAway },
        tension: 0.3
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 600, easing: "easeInOutQuart" },
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          enabled: false,
          external: function(context) {
            var tt = document.getElementById("tooltip");
            if (context.tooltip.opacity === 0) { tt.classList.remove("visible"); return; }
            var idx = context.tooltip.dataPoints && context.tooltip.dataPoints[0] && context.tooltip.dataPoints[0].dataIndex;
            if (idx === undefined || idx === null) return;
            var hp = homeData[idx];
            var ap = (100 - hp).toFixed(1);
            document.getElementById("ttTeam").textContent = homeAbbr + " " + hp + "% \u00b7 " + awayAbbr + " " + ap + "%";
            var sub = playTexts[idx] || "";
            document.getElementById("ttSub").textContent = sub.length > 70 ? sub.substring(0, 70) + "\u2026" : sub;

            var pos = context.tooltip.caretX;
            var wRect = document.getElementById("widget").getBoundingClientRect();
            var chartRect = document.getElementById("wpChart").getBoundingClientRect();
            var left = chartRect.left - wRect.left + pos + 12;
            if (left + 240 > wRect.width) left = chartRect.left - wRect.left + pos - 250;
            tt.style.left = left + "px";
            tt.style.top = (chartRect.top - wRect.top + context.tooltip.caretY - 20) + "px";
            tt.classList.add("visible");
          }
        }
      },
      scales: {
        x: { display: false },
        y: {
          min: 0, max: 100,
          ticks: {
            color: "#4b5563",
            font: { family: "'Barlow Condensed', sans-serif", size: 10 },
            callback: function(v) { return v === 50 ? "50%" : ""; },
            stepSize: 50
          },
          grid: {
            color: function(ctx) { return ctx.tick && ctx.tick.value === 50 ? "#2d3344" : "transparent"; }
          },
          border: { display: false }
        }
      }
    }
  });
}

function buildKeyPlays(plays, away, home, awayColor, homeColor) {
  var list = document.getElementById("playsList");
  if (!list) return;

  var swings = plays
    .filter(function(p) {
      return p.winProbability && p.winProbability.homeWinPercentage != null &&
             p.previousPlay && p.previousPlay.winProbability && p.previousPlay.winProbability.homeWinPercentage != null;
    })
    .map(function(p) {
      return { play: p, swing: p.winProbability.homeWinPercentage - p.previousPlay.winProbability.homeWinPercentage };
    })
    .filter(function(p) { return Math.abs(p.swing) > 0.08; })
    .sort(function(a, b) { return Math.abs(b.swing) - Math.abs(a.swing); })
    .slice(0, 8);

  if (swings.length === 0) {
    list.innerHTML = '<div class="play-item" style="color:#4b5563;font-size:11px;">No significant swing plays found in data.</div>';
    return;
  }

  list.innerHTML = swings.map(function(item) {
    var play = item.play;
    var swing = item.swing;
    var favored = swing > 0 ? home : away;
    var color = swing > 0 ? homeColor : awayColor;
    var pct = Math.round(Math.abs(swing) * 100);
    var desc = play.text || (play.type && play.type.text) || "Play";
    var period = play.period && play.period.number ? "Q" + play.period.number : "";
    var clock = (play.clock && play.clock.displayValue) || "";
    var abbr = (favored && favored.team && favored.team.abbreviation) || "";
    var shortDesc = desc.length > 80 ? desc.substring(0, 80) + "\u2026" : desc;
    return '<div class="play-item" style="border-left-color:' + color + '">' +
      '<span class="play-swing" style="color:' + color + '">+' + pct + '%</span>' +
      '<span class="play-desc">' +
        '<span style="color:' + color + ';font-family:\'Barlow Condensed\',sans-serif;font-weight:700;">' + abbr + '</span>' +
        (period ? ' <span style="color:#4b5563">' + period + ' ' + clock + '</span>' : '') +
        ' \u2014 ' + shortDesc +
      '</span>' +
    '</div>';
  }).join("");
}

function buildQuarterLabels(winProb) {
  var el = document.getElementById("quarterLabels");
  if (!el || winProb.length === 0) return;
  el.innerHTML = ["Q1","Q2","Q3","Q4","Final"].map(function(l) {
    return '<span class="q-label">' + l + '</span>';
  }).join("");
}

function showLoading() {
  document.getElementById("gameInfo").innerHTML = "";
  document.getElementById("content").innerHTML =
    '<div class="state-overlay"><div class="spinner"></div><span>Loading game data\u2026</span></div>';
}

function showError(msg) {
  document.getElementById("content").innerHTML =
    '<div class="state-overlay"><span class="error-msg">\u26a0 ' + msg + '</span></div>';
}

loadGame();
</script>
</body>
</html>
